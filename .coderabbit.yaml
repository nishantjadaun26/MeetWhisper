# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be concise, objective, and focus on security, performance, correctness, and best practices."
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "draft"
    drafts: false
    base_branches:
      - "main"
      - "master"
  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    eslint:
      enabled: true
    ast-grep:
      enabled: true
    markdownlint:
      enabled: true
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.git/**"
    - "!**/uploads/**"
    - "!**/*.min.js"
    - "!**/*.lock"
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
