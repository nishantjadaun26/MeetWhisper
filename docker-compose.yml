services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meetwhisper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetwhisper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetwhisper"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meetwhisper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetwhisper-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/meetwhisper
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - TRANSCRIBER_ENGINE=mock
      - LLM_PROVIDER=mock
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetwhisper-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/meetwhisper
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - TRANSCRIBER_ENGINE=mock
      - LLM_PROVIDER=mock
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: celery -A app.worker.celery_app.celery worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetwhisper-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pgdata:
  redisdata:
  uploads_data:
